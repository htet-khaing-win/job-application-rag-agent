[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["utilities", "abtest.py", "baseline_vs_hybrid_AB_test.py", "visualize_graph.py"]

[tool.ruff.lint]
# Correctness (E, F, B) and security (S) rules. Import-order/modernisation rules (I, UP) are intentionally
# not enforced. Documented exceptions:
#   S110  best-effort cleanup paths (logging / cache / keychain probing) must never fail a run
#   S101  assert is used for internal invariants and in tests
#   E701/E702/E501/B905/B007/B008  style only
select = ["E", "F", "B", "S"]
ignore = ["E501", "E701", "E702", "S101", "S110", "B008", "B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402"]
# `random` here is retry jitter / deterministic fault injection / bootstrap resampling, never key material.
"evals/*" = ["S311", "S607", "S105"]
"resilience.py" = ["S311"]
"runtime.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
# Scope grows as modules are annotated: database.py, pipeline.py and evals/ still have type errors
# (see `mypy database.py pipeline.py evals`). follow_imports=silent keeps those out of this gate.
files = ["security.py", "vault.py", "providers.py", "resilience.py", "runtime.py", "cost.py", "runlog.py", "cache.py", "export.py", "database.py", "pipeline.py", "history.py"]
follow_imports = "silent"

[tool.pytest.ini_options]
markers = [
    "heavy: needs large optional dependencies (presidio + spaCy en_core_web_trf); run in the dedicated CI job",
    "live: calls real provider APIs with your own keys; never run in CI",
]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
